<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Lesson... | Python Mastery</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Markmap Interactive Mindmap Libraries [179] -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.16"></script>
    <style>
        .markmap-svg {
            width: 100%;
            height: 100%;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo"><i class="fas fa-arrow-left"></i> Back to Course Hub</a>
            <div class="lesson-meta-nav">
                <span id="lesson-badge" class="badge">v000</span>
            </div>
        </div>
    </header>

    <main class="player-main container">
        <div class="player-grid">
            <!-- Left Side: Video Player & Metadata [114, 115] -->
            <div class="player-left">
                <h1 id="video-title" class="lesson-title">Loading Video Title...</h1>

                <!-- Responsive Aspect Ratio Video Container [80] -->
                <div class="video-container">
                    <iframe id="video-iframe" src="" frameborder="0" allowfullscreen></iframe>
                </div>

                <div class="description-card">
                    <h3>Lesson Description</h3>
                    <p id="video-description">Loading lesson notes...</p>
                </div>
            </div>

            <!-- Right Side: Interactive Assets Panel (Tabs) -->
            <div class="player-right">
                <div class="asset-tabs">
                    <button class="tab-btn active" onclick="switchTab('mindmap-tab')"><i class="fas fa-project-diagram"></i> Mind Map</button>
                    <button class="tab-btn" onclick="switchTab('quiz-tab')"><i class="fas fa-tasks"></i> Interactive Quiz</button>
                    <button class="tab-btn" onclick="switchTab('flashcard-tab')"><i class="fas fa-layer-group"></i> Flashcards</button>
                </div>

                <div class="tab-content-container">
                    <!-- Tab A: Markmap Mindmap [179] -->
                    <div id="mindmap-tab" class="tab-content active">
                        <div class="mindmap-container" style="height: 400px; width: 100%;">
                            <svg id="markmap-canvas" class="markmap-svg"></svg>
                        </div>
                        <p class="asset-hint"><i class="fas fa-info-circle"></i> Click and drag to pan; use scroll wheel to zoom.</p>
                    </div>

                    <!-- Tab B: Interactive Quiz [57] -->
                    <div id="quiz-tab" class="tab-content">
                        <div id="quiz-container" class="quiz-box">
                            <!-- Quizzes will render dynamically here -->
                        </div>
                    </div>

                    <!-- Tab C: Flashcards -->
                    <div id="flashcard-tab" class="tab-content">
                        <div class="flashcard-deck">
                            <div class="flashcard" onclick="this.classList.toggle('flipped')">
                                <div class="flashcard-inner">
                                    <div class="flashcard-front">
                                        <p id="fc-question">Click to flip and reveal Python answer key concepts.</p>
                                    </div>
                                    <div class="flashcard-back">
                                        <p id="fc-answer">Python variables are pointers, not containers.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <p class="asset-hint"><i class="fas fa-sync"></i> Click the card to flip it over.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/app.js"></script>
    <script>
        // Init Lesson Viewer Page
        document.addEventListener("DOMContentLoaded", () => {
            initVideoPlayer();
        });

        // Simple Tab Swapper
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }
    </script>
</body>
</html>
